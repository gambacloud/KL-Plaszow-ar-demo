<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>KL Plaszow - Desktop AR Simulator</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .hud-panel {
            position: absolute; top: 15px; right: 15px;
            background: rgba(20, 20, 20, 0.9); color: #f0f0f0;
            padding: 20px; border-radius: 8px; z-index: 999;
            max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            direction: rtl; border-right: 4px solid #cc0000;
        }
        .hud-panel h1 { margin: 0 0 8px 0; font-size: 18px; color: #ff3333; }
        .hud-panel p { margin: 0 0 12px 0; font-size: 13px; line-height: 1.4; color: #ccc; }
        .controls-guide {
            background: #2a2a2a; padding: 10px; border-radius: 4px; 
            font-size: 12px; color: #ffdd00; font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <h1>סימולטור פלאשוב AR</h1>
        <p>אם המסך ריק, לחץ עליו וגרור את העכבר שמאלה/ימינה כדי להסתובב. המבנים ממוקמים מסביבך במרחב.</p>
        <div class="controls-guide">
            <strong>מערכת שליטה:</strong><br>
            • סיבוב מבט: גרירה עם העכבר על המסך<br>
            • תנועה בשטח: מקשי החצים או W, A, S, D
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        
        <!-- סביבה בהירה יותר כדי לוודא שרואים את עומק השדה -->
        <a-sky color="#1a1a24"></a-sky>
        
        <!-- רצפת רשת (Grid) כדי לתת אינדיקציה ויזואלית לתנועה במרחב -->
        <a-entity position="0 0 0" rotation="-90 0 0" mixin="grid" 
                  geometry="primitive: plane; width: 1000; height: 1000;" 
                  material="type: grid; color: #333344; opacity: 0.4; fill: false;"></a-entity>

        <!-- תאורה בסיסית כדי שהמודלים לא יהיו חשוכים -->
        <a-entity light="type: ambient; color: #ffffff; intensity: 0.8;"></a-entity>
        <a-entity light="type: directional; color: #fff; intensity: 0.6" position="-0.5 1 1"></a-entity>

        <!-- מצלמה עם הגדרת מבט מובנית (look-controls) ותנועה (wasd-controls) -->
        <a-entity id="rig" position="0 1.6 0">
            <a-camera look-controls wasd-controls="acceleration: 40;"></a-camera>
        </a-entity>

        <!-- מיקומי המבנים - קורבו אליך כדי שיקפצו ישר לעין -->
        
        <!-- הבית האפור - ממוקם ישר לפניך (z: -15) -->
        <a-entity position="0 0 -15">
            <a-box scale="10 5 10" material="color: #4a4a5a; opacity: 0.85; wireframe: false;"></a-box>
            <a-text value="Szary dom\n(The Grey House)" align="center" position="0 3.5 0" scale="2 2 2" color="#ffffff" side="double"></a-text>
        </a-entity>

        <!-- משרדי המינהלת - מצד ימין שלך (x: 15) -->
        <a-entity position="15 0 -10">
            <a-box scale="12 3.5 8" material="color: #a1a1a1; opacity: 0.7; wireframe: true;"></a-box>
            <a-text value="Camp Administration" align="center" position="0 2.5 0" scale="1.5 1.5 1.5" color="#ff3333" side="double"></a-text>
        </a-entity>

        <!-- צריף גברים - מצד שמאל שלך (x: -15) -->
        <a-entity position="-15 0 -5">
            <a-box scale="15 3.2 6" material="color: #8d6e63; opacity: 0.7; transparent: true;"></a-box>
            <a-text value="Men's Barracks" align="center" position="0 2.2 0" scale="1.5 1.5 1.5" color="#ffffff" side="double"></a-text>
        </a-entity>

    </a-scene>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            console.log("Plaszow AR Local Mock Engine Loaded Successfully.");
        });
    </script>
</body>
</html>
