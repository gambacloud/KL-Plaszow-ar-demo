<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>KL Plaszow - Desktop AR Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        
        /* פאנל מדריך ימני */
        .hud-panel {
            position: absolute; top: 15px; right: 15px;
            background: rgba(20, 20, 20, 0.9); color: #f0f0f0;
            padding: 20px; border-radius: 8px; z-index: 999;
            max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            direction: rtl; border-right: 4px solid #cc0000;
        }
        .hud-panel h1 { margin: 0 0 8px 0; font-size: 18px; color: #ff3333; }
        .hud-panel p { margin: 0 0 12px 0; font-size: 13px; line-height: 1.4; color: #ccc; }
        .controls-guide {
            background: #2a2a2a; padding: 10px; border-radius: 4px; 
            font-size: 12px; color: #ffdd00; font-family: monospace;
        }

        /* פאנל ניווט שמאלי */
        .nav-panel {
            position: absolute; top: 15px; left: 15px;
            background: rgba(25, 25, 25, 0.95); color: #fff;
            padding: 20px; border-radius: 8px; z-index: 999;
            width: 260px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            direction: rtl; border-left: 4px solid #0088cc;
        }
        .nav-panel h2 { margin: 0 0 12px 0; font-size: 16px; color: #00aaff; }
        .nav-btn {
            display: block; width: 100%; background: #333; color: #fff;
            border: 1px solid #444; padding: 10px; margin-bottom: 8px;
            border-radius: 4px; cursor: pointer; text-align: right;
            font-size: 13px; transition: background 0.2s;
        }
        .nav-btn:hover { background: #444; color: #00aaff; }
        .reset-btn {
            background: #cc0000; color: white; font-weight: bold;
            margin-top: 15px; border: none; text-align: center;
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <h1>סימולטור פלאשוב AR</h1>
        <p>אם המסך עדיין ריק, לחץ וגרור את העכבר כדי לסובב את המבט - המבנים ממוקמים מסביבך.</p>
        <div class="controls-guide">
            <strong>שליטה:</strong> עכבר לסיבוב המבט, מקשי WASD או חיצים לתנועה.
        </div>
    </div>

    <div class="nav-panel">
        <h2>מקרא וניווט מהיר</h2>
        <button class="nav-btn" onclick="teleportTo(0, 0, -10, 0)">🏠 קח אותי אל: הבית האפור</button>
        <button class="nav-btn" onclick="teleportTo(25, 0, -5, -60)">🏢 קח אותי אל: משרדי המינהלת</button>
        <button class="nav-btn" onclick="teleportTo(-25, 0, 0, 60)">🪵 קח אותי אל: צריף הגברים</button>
        <button class="nav-btn reset-btn" onclick="resetPosition()">🔄 איפוס מיקום (Reset)</button>
    </div>

    <a-scene vr-mode-ui="enabled: false" embedded style="height: 100vh; width: 100vw;">
        
        <a-sky color="#1a1a24"></a-sky>
        
        <a-plane position="0 0 0" rotation="-90 0 0" width="300" height="300" color="#2c2c38"></a-plane>

        <a-entity light="type: ambient; color: #ffffff; intensity: 0.9;"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="-1 4 2"></a-entity>

        <a-entity id="rig" position="0 0 0">
            <a-camera id="main-camera" look-controls wasd-controls="acceleration: 50;"></a-camera>
        </a-entity>

        <a-entity position="0 0 -15">
            <a-box width="10" height="5" depth="10" color="#555566" opacity="0.9"></a-box>
            <a-text value="Szary dom\n(The Grey House)" align="center" position="0 4 0" scale="2 2 2" color="#ffffff" side="double"></a-text>
        </a-entity>

        <a-entity position="25 0 -10">
            <a-box width="12" height="3.5" depth="8" color="#993333" opacity="0.8"></a-box>
            <a-text value="Camp Administration" align="center" position="0 3 0" scale="1.5 1.5 1.5" color="#ffffff" side="double"></a-text>
        </a-entity>

        <a-entity position="-25 0 -5">
            <a-box width="15" height="3.2" depth="6" color="#8d6e63" opacity="0.8"></a-box>
            <a-text value="Men's Barracks" align="center" position="0 2.5 0" scale="1.5 1.5 1.5" color="#ffffff" side="double"></a-text>
        </a-entity>

    </a-scene>

    <script>
        // פונקציית הניווט המשודרגת שעובדת עם גבהים מאופסים לבטיחות
        function teleportTo(x, y, z, rotationY) {
            const rig = document.getElementById('rig');
            const camera = document.getElementById('main-camera');
            if(rig && camera) {
                rig.setAttribute('position', x + ' ' + y + ' ' + z);
                if(camera.components['look-controls']) {
                    camera.components['look-controls'].yawTurn = rotationY * Math.PI / 180;
                    camera.components['look-controls'].pitchTurn = 0;
                }
            }
        }

        function resetPosition() {
            teleportTo(0, 0, 0, 0);
        }
    </script>
</body>
</html>
