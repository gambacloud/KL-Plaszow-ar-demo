<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>KL Plaszow - Automated AR Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        
        .hud-panel {
            position: absolute; top: 15px; right: 15px;
            background: rgba(20, 20, 20, 0.9); color: #f0f0f0;
            padding: 20px; border-radius: 8px; z-index: 999;
            max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            direction: rtl; border-right: 4px solid #cc0000;
        }
        .hud-panel h1 { margin: 0 0 8px 0; font-size: 18px; color: #ff3333; }
        .hud-panel p { margin: 0 0 12px 0; font-size: 13px; line-height: 1.4; color: #ccc; }
        
        .nav-panel {
            position: absolute; top: 15px; left: 15px;
            background: rgba(25, 25, 25, 0.95); color: #fff;
            padding: 20px; border-radius: 8px; z-index: 999;
            width: 280px; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            direction: rtl; border-left: 4px solid #0088cc;
        }
        .nav-panel h2 { margin: 0 0 12px 0; font-size: 16px; color: #00aaff; }
        
        .nav-btn {
            display: block; width: 100%; background: #333; color: #fff;
            border: 1px solid #444; padding: 10px; margin-bottom: 8px;
            border-radius: 4px; cursor: pointer; text-align: right;
            font-size: 12px; transition: background 0.2s;
        }
        .nav-btn:hover { background: #444; color: #00aaff; }
        .reset-btn { background: #cc0000; color: white; font-weight: bold; margin-top: 15px; border: none; text-align: center; }
        .reset-btn:hover { background: #ff3333; }
    </style>
</head>
<body>

    <div class="hud-panel">
        <h1>מערך פלאשוב AR דינמי</h1>
        <p>הדמיית המרחב ההיסטורי נטענת כעת אוטומטית מקובץ הנתונים של המוזיאון.</p>
    </div>

    <div class="nav-panel">
        <h2>רשימת מבנים (קפיצה מהירה)</h2>
        <div id="dynamic-buttons"></div>
        <button class="nav-btn reset-btn" onclick="resetPosition()">🔄 איפוס נקודת התחלה (Reset)</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" style="height: 100vh; width: 100vw;">
        <a-sky color="#13131a"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="500" height="500" color="#22222b"></a-plane>

        <a-entity light="type: ambient; color: #ffffff; intensity: 0.9;"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="-1 4 2"></a-entity>

        <a-entity id="rig" position="0 0 0">
            <a-camera id="main-camera" look-controls wasd-controls="acceleration: 50;"></a-camera>
        </a-entity>

        <a-entity id="camp-structures"></a-entity>
    </a-scene>

    <script>
        // מיקום נקודת האמצע הווירטואלית של הסימולטור (ננעל על אזור הבית האפור כמרכז)
        const CENTER_LAT = 50.033036;
        const CENTER_LNG = 19.966311;

        // המרת קואורדינטות גיאוגרפיות למטרים במרחב תלת-ממדי (יחסי למרכז)
        function geodeticToLocal(lat, lng) {
            const latDistance = (lat - CENTER_LAT) * 111139; 
            const lngDistance = (lng - CENTER_LNG) * (111139 * Math.cos(CENTER_LAT * Math.PI / 180));
            return {
                x: lngDistance, 
                z: -latDistance // ב-A-Frame ציר Z שלילי פירושו קדימה
            };
        }

        // טעינת הנתונים ורנדור המבנים בשטח
        async function loadCampData() {
            try {
                const response = await fetch('plaszow_data.json');
                const structures = await response.json();
                
                const container = document.getElementById('camp-structures');
                const btnContainer = document.getElementById('dynamic-buttons');
                
                structures.forEach((item, index) => {
                    const localCoords = geodeticToLocal(item.lat, item.lng);
                    
                    // 1. יצירת היישות התלת ממדית עבור המבנה
                    const entity = document.createElement('a-entity');
                    entity.setAttribute('position', `${localCoords.x} 0 ${localCoords.z}`);
                    
                    // יצירת הקופסה (הצריף)
                    const box = document.createElement('a-box');
                    box.setAttribute('width', item.scale.w);
                    box.setAttribute('height', item.scale.h);
                    box.setAttribute('depth', item.scale.d);
                    box.setAttribute('material', `color: ${item.color}; opacity: 0.85;`);
                    entity.appendChild(box);
                    
                    // יצירת טקסט השם מעל המבנה
                    const text = document.createElement('a-text');
                    text.setAttribute('value', item.name);
                    text.setAttribute('align', 'center');
                    text.setAttribute('position', `0 ${item.scale.h + 1} 0`);
                    text.setAttribute('scale', '1.8 1.8 1.8');
                    text.setAttribute('color', '#ffffff');
                    text.setAttribute('side', 'double');
                    entity.appendChild(text);
                    
                    container.appendChild(entity);
                    
                    // 2. יצירת כפתור ניווט דינמי בפאנל השמאלי
                    const btn = document.createElement('button');
                    btn.className = 'nav-btn';
                    btn.innerHTML = `📍 ${item.name}`;
                    // בעת לחיצה, המצלמה תקפוץ 12 מטרים ליד המבנה כדי שיוכלו לראות אותו בבירור
                    btn.onclick = () => teleportTo(localCoords.x, 0, localCoords.z + 12, 0);
                    btnContainer.appendChild(btn);
                });
                
                console.log(`Successfully rendered ${structures.length} structures from KML data.`);
            } catch (error) {
                console.error("Error loading Plaszow JSON map data:", error);
            }
        }

        function teleportTo(x, y, z, rotationY) {
            const rig = document.getElementById('rig');
            const camera = document.getElementById('main-camera');
            if(rig && camera) {
                rig.setAttribute('position', x + ' ' + y + ' ' + z);
                if(camera.components['look-controls']) {
                    camera.components['look-controls'].yawTurn = rotationY * Math.PI / 180;
                    camera.components['look-controls'].pitchTurn = 0;
                }
            }
        }

        function resetPosition() {
            teleportTo(0, 0, 0, 0);
        }

        // הפעלת הטעינה האוטומטית ברגע שהדף מוכן
        window.addEventListener('DOMContentLoaded', loadCampData);
    </script>
</body>
</html>
