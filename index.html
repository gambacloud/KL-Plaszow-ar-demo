<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>KL Plaszow - Desktop AR Simulator</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* פאנל הסבר ימני */
        .hud-panel {
            position: absolute; top: 15px; right: 15px;
            background: rgba(20, 20, 20, 0.9); color: #f0f0f0;
            padding: 20px; border-radius: 8px; z-index: 999;
            max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            direction: rtl; border-right: 4px solid #cc0000;
        }
        .hud-panel h1 { margin: 0 0 8px 0; font-size: 18px; color: #ff3333; }
        .hud-panel p { margin: 0 0 12px 0; font-size: 13px; line-height: 1.4; color: #ccc; }
        .controls-guide {
            background: #2a2a2a; padding: 10px; border-radius: 4px; 
            font-size: 12px; color: #ffdd00; font-family: monospace;
        }

        /* פאנל ניווט ומקרא שמאלי */
        .nav-panel {
            position: absolute; top: 15px; left: 15px;
            background: rgba(25, 25, 25, 0.95); color: #fff;
            padding: 20px; border-radius: 8px; z-index: 999;
            width: 260px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            direction: rtl; border-left: 4px solid #0088cc;
        }
        .nav-panel h2 { margin: 0 0 12px 0; font-size: 16px; color: #00aaff; }
        .nav-btn {
            display: block; width: 100%; background: #333; color: #fff;
            border: 1px solid #444; padding: 10px; margin-bottom: 8px;
            border-radius: 4px; cursor: pointer; text-align: right;
            font-size: 13px; transition: background 0.2s;
        }
        .nav-btn:hover { background: #444; color: #00aaff; }
        .reset-btn {
            background: #cc0000; color: white; font-weight: bold;
            margin-top: 15px; border: none; text-align: center;
        }
        .reset-btn:hover { background: #ff3333; color: white; }
    </style>
</head>
<body>

    <div class="hud-panel">
        <h1>סימולטור פלאשוב AR</h1>
        <p>הדמיית המרחב ההיסטורי על בסיס נתוני המוזיאון ומפות 1944.</p>
        <div class="controls-guide">
            <strong>מערכת שליטה ידנית:</strong><br>
            • סיבוב מבט: גרירה עם העכבר על המסך<br>
            • תנועה בשטח: מקשי החצים או W, A, S, D
        </div>
    </div>

    <div class="nav-panel">
        <h2>מקרא וקפיצה למבנה</h2>
        <button class="nav-btn" onclick="teleportTo(0, 1.6, -10, 0)">🏠 קח אותי אל: הבית האפור</button>
        <button class="nav-btn" onclick="teleportTo(15, 1.6, -5, -45)">🏢 קח אותי אל: משרדי המינהלת</button>
        <button class="nav-btn" onclick="teleportTo(-15, 1.6, 0, 45)">🪵 קח אותי אל: צריף הגברים (Barracks)</button>
        
        <button class="nav-btn reset-btn" onclick="resetPosition()">🔄 איפוס נקודת התחלה (Reset)</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        
        <a-sky color="#1a1a24"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#222233"></a-plane>

        <a-entity light="type: ambient; color: #ffffff; intensity: 0.8;"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 0.4" position="-1 2 1"></a-entity>

        <a-entity id="rig" position="0 1.6 0">
            <a-camera id="main-camera" look-controls wasd-controls="acceleration: 50;"></a-camera>
        </a-entity>

        <a-entity position="0 0 -15">
            <a-box scale="10 5 10" material="color: #555566; opacity: 0.9;"></a-box>
            <a-text value="Szary dom\n(The Grey House)" align="center" position="0 3.5 0" scale="2 2 2" color="#ffffff" side="double"></a-text>
        </a-entity>

        <a-entity position="25 0 -10">
            <a-box scale="12 3.5 8" material="color: #993333; opacity: 0.8;"></a-box>
            <a-text value="Camp Administration" align="center" position="0 2.5 0" scale="1.5 1.5 1.5" color="#ffffff" side="double"></a-text>
        </a-entity>

        <a-entity position="-25 0 -5">
            <a-box scale="15 3.2 6" material="color: #8d6e63; opacity: 0.8;"></a-box>
            <a-text value="Men's Barracks" align="center" position="0 2.2 0" scale="1.5 1.5 1.5" color="#ffffff" side="double"></a-text>
        </a-entity>

    </a-scene>

    <script>
        // פונקציה שמקבלת קואורדינטות תלת-ממדיות וזווית מבט, ומקפיצה את המשתמש לשם
        function teleportTo(x, y, z, rotationY) {
            const rig = document.getElementById('rig');
            const camera = document.getElementById('main-camera');
            
            // שינוי מיקום הריג (הרגליים של המשתמש)
            rig.setAttribute('position', `${x} ${y} ${z}`);
            
            // איפוס ושינוי זווית המבט של המצלמה (הראש של המשתמש) לטובת המבנה הנבחר
            camera.components['look-controls'].yawTurn = rotationY * Math.PI / 180;
            camera.components['look-controls'].pitchTurn = 0;
        }

        // פונקציית האיפוס שמחזירה את המשתמש בדיוק לנקודת ההתחלה המקורית
        function resetPosition() {
            teleportTo(0, 1.6, 0, 0);
        }

        window.addEventListener('DOMContentLoaded', () => {
            console.log("Plaszow AR Interactive Navigation Simulator Active.");
        });
    </script>
</body>
</html>
